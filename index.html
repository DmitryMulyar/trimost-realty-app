<title>Тримост Клиент</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тримост">
<meta name="theme-color" content="#002C4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: одна колонка телефона (до 440px), шапка сверху, таб-бар снизу, экраны меняются внутри */
:root{
  --navy:#002C4A; --navy-2:#0D3D61; --bronze:#AA6A22; --bronze-soft:#F6ECDF;
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#0F2333; --muted:#5D6B78; --line:#DCE2E7; --soft:#E9EEF2;
  --good:#1F7A4D; --good-soft:#E3F2EA; --warn:#B26B00; --warn-soft:#FBF0DD; --bad:#A3262A; --bad-soft:#F8E6E6;
  --f:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.shell{max-width:440px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
@media(min-width:480px){.shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* шапка */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.top h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#fff;position:relative;flex:none}
.iconbtn.ava{border-radius:50%;background:#fff;color:var(--navy);font-weight:700;font-size:13px;letter-spacing:.02em;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.iconbtn.ava[aria-current]{box-shadow:0 0 0 2px var(--bronze)}
.iconbtn svg{width:20px;height:20px}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bronze);border:2px solid var(--navy)}
.logo{width:34px;height:34px;flex:none;background:#fff;border-radius:50%;padding:1px}

/* таб-бар */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);z-index:20;background:var(--panel);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:10px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--navy)}
.tab[aria-current="page"] svg{color:var(--bronze)}

main{padding-block:16px 24px;display:grid;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 2px -4px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px;letter-spacing:.02em}
.ex{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bronze);background:var(--bronze-soft);border-radius:6px;padding:2px 6px;vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.go{background:var(--soft);color:var(--navy)}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--navy);color:#fff;width:100%;display:flex;justify-content:center;align-items:center;gap:8px}
.btn.bronze{background:var(--bronze)}
.btn.ghost{background:var(--panel);color:var(--navy);border:1.5px solid var(--line)}
.btn:active{transform:scale(.985)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* приветствие */
.hello{background:var(--navy);color:#fff;border:0;position:relative;overflow:hidden}
.hello .muted{color:#B9C8D6}
.hello b{font-size:20px}
.hello .arch{position:absolute;right:-18px;bottom:-34px;width:150px;opacity:.16}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center;line-height:1.2}
.q svg{width:24px;height:24px;color:var(--bronze)}

/* карточка заказа */
.order{display:grid;gap:10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:14px}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.city b{display:block;font-size:15px}
.city span{font-size:12px;color:var(--muted)}
.city.r{text-align:right}
.mode{font-size:11px;font-weight:700;color:var(--bronze);text-align:center;letter-spacing:.04em}
.mode svg{display:block;margin:0 auto;width:40px;height:12px;color:var(--line)}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bronze);border-radius:6px}

/* табло этапов */
.steps{list-style:none;margin:0;padding:0}
.st{display:grid;grid-template-columns:22px 1fr auto;gap:12px;position:relative;padding-bottom:16px}
.st:last-child{padding-bottom:0}
.st::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.st:last-child::before{display:none}
.st.done::before{background:var(--bronze)}
.mk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center}
.st.done .mk{background:var(--bronze);border-color:var(--bronze);color:#fff}
.st.now .mk{border-color:var(--bronze);box-shadow:0 0 0 4px var(--bronze-soft)}
.st.now .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--bronze)}
.mk svg{width:12px;height:12px}
.st .t{font-weight:600}
.st:not(.done):not(.now) .t{color:var(--muted);font-weight:500}
.st .d{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.st .src{font-size:11.5px;color:var(--muted)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;min-width:0;overflow-wrap:anywhere}

.list{display:grid}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.li:first-child{border-top:0;padding-top:2px}
.li .ic{width:40px;height:40px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none;color:var(--navy);font-size:11px;font-weight:800;letter-spacing:.02em}
.li .ic.b{background:var(--bronze-soft);color:var(--bronze)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{font-size:12.5px;color:var(--muted)}
.chev{width:16px;height:16px;color:var(--muted);flex:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}

/* формы */
label.f{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--panel);font-size:16px;color:var(--ink);font-weight:500}
.inp:focus{border-color:var(--navy);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 0;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--navy);box-shadow:0 1px 2px rgba(0,44,74,.12)}
.swap{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--navy);align-self:end;margin-bottom:5px}
.swap svg{width:18px;height:18px}

.total{background:var(--navy);color:#fff;border:0}
.total .big{font-size:30px;font-weight:800;letter-spacing:-.01em}
.total .muted{color:#B9C8D6}
.total .kv dt{color:#B9C8D6}
.total hr{border:0;border-top:1px solid rgba(255,255,255,.15);margin:12px 0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px 14px;text-align:left;display:grid;gap:8px;min-height:116px;align-content:space-between}
.tile svg{width:28px;height:28px;color:var(--bronze)}
.tile b{font-size:16px}
.tile span{font-size:12.5px;color:var(--muted);line-height:1.3}

/* чат */
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14.5px}
.msg.them{background:var(--panel);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}

function orderCard(o){
 const pct=Math.round(Math.min(o.stage,9)/9*100);
 const [st,cls]=o.stage>=9?(o.issue?['Закрыт · была претензия','warn']:['Закрыт','ok']):[cur(o),'go'];
 return `<button class="order" data-act="order" data-id="${o.id}">
  <div class="row between"><span class="mono">${o.id}</span><span class="pill ${cls}">${st}</span></div>
  <div class="route"><div class="city"><b>${o.from}</b><span>Китай</span></div><div class="mode">${I.line}${o.mode.toUpperCase()}</div><div class="city r"><b>${o.to}</b><span>Россия</span></div></div>
  <div class="small" style="font-weight:600">${esc(o.title)}</div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="row between small muted"><span>Этап ${Math.min(o.stage+ (o.stage<9?1:0),9)} из 9</span><span>${o.stage>=9?'получен '+o.dates[7]:'план у вас '+o.plan}</span></div>
 </button>`;
}
function home(){
 const act=S.orders.filter(o=>o.stage<9);

 return shell('Тримост',`

function orders(){
 const list=S.orders.filter(o=>S.filter==='active'?o.stage<9:o.stage>=9);
 return shell('Мои заказы',`
  <div class="chips"><button class="chip" data-filter="active" aria-pressed="${S.filter==='active'}">В работе · ${S.orders.filter(o=>o.stage<9).length}</button><button class="chip" data-filter="done" aria-pressed="${S.filter==='done'}">Завершены · ${S.orders.filter(o=>o.stage>=9).length}</button></div>

}
function order(id){
 const o=S.orders.find(x=>x.id===id); if(!o) return home();
 const docs=S.docs.map((d,i)=>[d,i]).filter(([d])=>d.o===o.id);
 const steps=STAGES.map(([t,src],i)=>{
  const cls=i<o.stage?'done':(i===o.stage&&o.stage<9?'now':'');
  return `<li class="st ${cls}"><span class="mk">${cls==='done'?I.check:''}</span><div><div class="t">${t}</div><div class="src">${src}</div></div><div class="d num">${o.dates[i]||''}</div></li>`}).join('');
 const debt=o.sum-o.paid;
 return shell(o.id,`
  <section class="panel" style="display:grid;gap:12px">
   <div class="route"><div class="city"><b>${o.from}</b><span>Китай</span></div><div class="mode">${I.line}${o.mode.toUpperCase()}</div><div class="city r"><b>${o.to}</b><span>Россия</span></div></div>
   <div style="font-weight:700">${esc(o.title)} <span class="ex">пример</span></div>
   <div class="row small muted num"><span>${fmt(o.kg)} кг</span>·<span>${String(o.m3).replace('.',',')} м³</span>·<span>${o.stage>=9?'получен '+o.dates[7]:'план у вас '+o.plan}</span></div>
  </section>
  ${o.stage===7?`<div class="panel" style="display:grid;gap:10px"><b>Груз уже у вас?</b><div class="btns"><button class="btn" data-act="got" data-id="${o.id}">Да, всё в порядке</button><button class="btn ghost" data-act="issue" data-id="${o.id}">Что-то не так</button></div></div>`:''}
  <div class="h2">Где груз</div>
  <section class="panel"><ol class="steps">${steps}</ol></section>
  <div class="h2">Перевозка</div>
  <section class="panel"><dl class="kv">
   <dt>Китай → Россия</dt><dd>${esc(o.carrier)}</dd>
   <dt>Трек</dt><dd><button class="chip mono" data-copy="${o.track}" style="padding:4px 10px">${o.track} ${I.copy.replace('<svg','<svg width="13" height="13" style="vertical-align:-2px"')}</button></dd>
   ${o.track2?`<dt>По России</dt><dd>${esc(o.carrier2)}</dd><dt>Трек по России</dt><dd><button class="chip mono" data-copy="${o.track2}" style="padding:4px 10px">${o.track2}</button></dd>`:''}
  </dl></section>
  <div class="h2">Смета заказа <span class="ex">пример структуры</span></div>
  <section class="panel" style="display:grid;gap:8px">
   ${(o.est||[]).map(([n,sh])=>`<div><div class="row between small"><span>${n}</span><b class="num">${rub(o.sum*sh)}</b></div><div class="bar" style="margin-top:4px"><i style="width:${Math.round(sh*100)}%"></i></div></div>`).join('')}
  </section>
  <div class="h2">Деньги</div>
  <section class="panel"><dl class="kv num">
   <dt>Сумма заказа</dt><dd>${rub(o.sum)}</dd><dt>Оплачено</dt><dd style="color:var(--good)">${rub(o.paid)}</dd>
   <dt>Осталось</dt><dd style="color:${debt>0?'var(--warn)':'var(--good)'}">${debt>0?rub(debt):'0 ₽'}</dd></dl>
   ${(o.pays||[]).length?`<div class="h2" style="margin-top:12px">Платежи</div><div class="list">${o.pays.map(p=>`<div class="li" style="padding:8px 0"><div class="ic" style="width:34px;height:34px">₽</div><div class="tx"><b>${rub(p.s)}</b><span>${p.d} · ${esc(p.m)}</span></div></div>`).join('')}</div>`:''}
   ${debt>0?`<button class="btn" style="margin-top:12px" data-act="pay" data-id="${o.id}">Получить счёт на ${rub(debt)}</button>`:'<div class="pill ok" style="margin-top:12px">оплачен полностью</div>'}
  </section>
  <div class="h2">Документы заказа</div>
  <section class="panel list">${docs.length?docs.map(([d,i])=>docRow(d,i)).join(''):'<div class="empty">Документы появятся по ходу заказа</div>'}</section>
  <button class="btn ghost" data-act="chat" data-id="${o.id}">${I.chat.replace('<svg','<svg width="20" height="20"')} Написать менеджеру</button>
 `);
}
function payScreen(id){
 const o=S.orders.find(x=>x.id===id); if(!o) return home();
 const debt=o.sum-o.paid;
 return shell('Оплата '+o.id,`
  <section class="panel" style="display:grid;gap:10px">
   <div class="row between"><b>Счёт № ${318+S.orders.indexOf(o)}</b><span class="ex">пример</span></div>
   <div class="small muted">ООО «Пример Трейд» · заказ ${o.id}</div>

   <div class="bar"><i style="width:${Math.round(o.paid/o.sum*100)}%"></i></div>
   <div class="row between small muted"><span>оплачено ${rub(o.paid)}</span><span>осталось ${rub(debt)}</span></div>
  </section>
  <section class="panel" style="display:grid;gap:8px">
   <b class="small">Как оплатить</b>

const DOCIC={'Бронь':'БР','Одобрение банка':'БАНК','ДДУ':'ДДУ','Выписка ЕГРН':'ЕГРН','Счёт':'СЧ','ДТ':'ДТ','Инвойс':'INV','CMR':'CMR','Договор':'ДОГ','УПД':'УПД','Отчёт агента':'ОА','Сертификат':'СЕР','Акт сверки':'АКТ'};
function docRow(d,i){
 return `<button class="li" data-act="doc" data-i="${i}"><div class="ic ${d.src==='1С'?'':'b'}">${DOCIC[d.t]}</div><div class="tx"><b>${d.t} ${esc(d.no)}</b><span>${d.d} · ${d.o}${d.sum?' · '+rub(d.sum):''}</span></div>${d.sign.includes('ждёт')?'<span class="pill warn">подписать</span>':I.chev}</button>`;
}
function docs(){
 const types=['Все','Счёт','УПД','Отчёт агента','ДТ','CMR','Договор','Акт сверки'];
 const list=S.docs.map((d,i)=>[d,i]).filter(([d])=>d.dir!=='re'&&(S.docFilter==='Все'||d.t===S.docFilter));
 return shell('Документы',`
  <div class="chips">${types.map(t=>`<button class="chip" data-docf="${t}" aria-pressed="${S.docFilter===t}">${t}</button>`).join('')}</div>
  <section class="panel list">${list.map(([d,i])=>docRow(d,i)).join('')||'<div class="empty">Документов такого типа пока нет</div>'}</section>
  <div class="btns"><button class="btn ghost" data-act="pack">Пакет для бухгалтерии</button><button class="btn ghost" data-act="sverka">Запросить акт сверки</button></div>
  <p class="hint">Счета, УПД, акты и отчёты агента придут из 1С. ДТ, CMR, инвойсы и сертификаты менеджер прикрепляет к сделке в Битрикс24.</p>`);
}
function docSheet(i){
 const d=S.docs[i];
 const body=d.t==='Счёт'||d.t==='УПД'||d.t==='Отчёт агента'||d.t==='Акт сверки'
  ?`<table><tr><th>Наименование</th><th>Сумма, ₽</th></tr><tr><td>${d.t==='Отчёт агента'?'Закупка товара и организация доставки по заказу '+d.o:'Агентское вознаграждение по заказу '+d.o}</td><td class="num">${d.sum?fmt(d.sum):'—'}</td></tr></table><div>Итого: <b class="num">${d.sum?rub(d.sum):'—'}</b></div>`
  :`<table><tr><th>Заказ</th><td>${d.o}</td></tr><tr><th>Источник</th><td>${d.src}</td></tr><tr><th>Дата</th><td>${d.d}</td></tr></table>`;
 const el=document.createElement('div');el.className='sheet';
 el.innerHTML=`<div class="in" role="dialog" aria-label="${d.t}"><div class="grab"></div>
  <div class="row between"><b style="font-size:17px">${d.t} ${esc(d.no)}</b><span class="ex">пример</span></div>
  <div class="paper">${LOGO('stamp')}<h3>${d.t.toUpperCase()} ${esc(d.no)} от ${d.d}</h3>
   <div>Исполнитель: ООО «Тримост Партнёрс»</div><div>Заказчик: ООО «Пример Трейд», ИНН 0000000000</div>${body}</div>
  <dl class="kv small"><dt>Откуда документ</dt><dd>${d.src}</dd><dt>Подписание</dt><dd>${d.sign}</dd></dl>
  ${d.sign.includes('ждёт')?'<button class="btn bronze" data-act="sign">Подписать в ЭДО</button>':''}
  <div class="btns"><button class="btn ghost" data-act="dl">Скачать PDF</button><button class="btn" data-act="close">Закрыть</button></div></div>`;
 el.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(e.target===el||a&&a.dataset.act==='close'){el.remove();return}
  if(a&&a.dataset.act==='dl')toast('В рабочей версии откроется PDF из 1С');
  if(a&&a.dataset.act==='sign'){d.sign='подписан в ЭДО';S.notes.forEach(n=>{if(n.t.includes('подпис'))n.new=false});el.remove();toast('Отчёт агента подписан');render()}});

 {n:'Ж/д · сборный',mode:'Ж/д',cur:'USD',kg:2.2,m3:280,m:'max',coef:0,min:110,fix:0,d:[25,35],note:'стабильный график, дешевле авто'},
 {n:'Море + ж/д · крупные партии',mode:'Море + ж/д',cur:'USD',kg:0,m3:200,m:'m3',coef:0,min:150,fix:0,d:[40,55],note:'выгодно от 10 м³, дольше в пути'},
 {n:'Авиа · срочно',mode:'Авиа',cur:'USD',kg:6.5,m3:0,m:'vol',coef:167,min:65,fix:0,d:[7,12],note:'объёмный вес: 1 м³ = 167 кг'}];
let Clines=[
 {name:'Светодиодные светильники',qty:500,price:38,kg:420,m3:2.6,duty:7.5},

let Cc={from:'Гуанчжоу',to:'Москва',kind:'Опт',china:900,ins:true,cert:0,svh:6000,ru:18000,carrier:0};
function cfreight(c,kg,m3){
 const base=c.m==='vol'?Math.max(kg,m3*c.coef)*c.kg:c.m==='m3'?m3*c.m3:Math.max(kg*c.kg,m3*c.m3);
 const rate=c.cur==='CNY'?P.cny:P.usd;
 return (Math.max(base,c.min)+c.fix)*rate;
}
function ccompute(ci){
 const c=CARRIERS[ci], k=P.cny*(1+P.mk);
 const L=Clines.map(x=>({...x,rub:(+x.qty||0)*(+x.price||0)*k}));
 const goods=L.reduce((s,x)=>s+x.rub,0), qty=L.reduce((s,x)=>s+(+x.qty||0),0);
 const kg=L.reduce((s,x)=>s+(+x.kg||0),0), m3=L.reduce((s,x)=>s+(+x.m3||0),0);
 const china=Cc.china*k, pay=(goods+china)*P.pay, intl=cfreight(c,kg,m3);
 const ins=Cc.ins?goods*P.ins:0;
 let duty=0,vat=0,ts=0;
 L.forEach(x=>{const sh=goods?x.rub/goods:0,t=x.rub+sh*(intl*P.border+ins);ts+=t;const d=t*(+x.duty||0)/100;duty+=d;vat+=(t+d)*P.vat;});
 let fee=0; for(const f of FEE){ if(ts>=f[0]) fee=f[1]; }
 let rew=0;
 if(goods) rew=Cc.kind==='Частный'?Math.max(goods*.10,5000):goods*(goods>=3e6?.04:goods>=1e6?.05:goods>=3e5?.06:.08);
 const res=(fee+duty+vat)*P.reserve;
 const direct=Cc.kind==='Частный'?500:1250;
 const total=goods+pay+china+intl+ins+Cc.cert+Cc.svh+Cc.ru+P.broker+fee+duty+vat+res+rew;
 return {c,goods,qty,kg,m3,china,pay,intl,ins,duty,vat,fee,res,rew,direct,total,unit:qty?(total-res)/qty:0,days:[c.d[0]+7,c.d[1]+15]};
}
function calcRes(){ return ccompute(Cc.carrier); }
const CNY=P.cny;

  <div class="panel" style="display:grid;gap:8px;padding:10px">
   ${all.map((x,i)=>`<button data-act="ccar" data-i="${i}" style="display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1.5px solid ${i===Cc.carrier?'var(--bronze)':'var(--line)'};border-radius:12px;padding:10px 12px;background:${i===Cc.carrier?'var(--bronze-soft)':'var(--panel)'}">

     <span class="small">${i===best?'<span class="pill ok">выгоднее всех</span>':`<span class="muted num">+${rub(x.total-all[best].total)}</span>`}</span>

function planPic(o){
 const n=o.rooms==='Студия'?0:o.rooms==='3+'?3:+o.rooms, A=o.m2, k=n===0?Math.round(A*0.62):Math.round(A*0.18);
 const roomA=n?Math.round((A*0.62)/n*10)/10:0, bath=Math.round(A*0.07*10)/10, hall=Math.round((A-k-roomA*n-bath)*10)/10;
 const W=150,H=90,x0=5,y0=5; const lab=(x,y,t,a)=>`<text x="${x}" y="${y}" font-size="6.5" font-family="Golos Text,Arial" fill="#0F2333" text-anchor="middle">${t}</text><text x="${x}" y="${y+8}" font-size="6" font-family="Golos Text,Arial" fill="#5D6B78" text-anchor="middle">${String(a).replace('.',',')} м²</text>`;
 let r=`<rect x="${x0}" y="${y0}" width="${W}" height="${H}" fill="#fff" stroke="#002C4A" stroke-width="2"/>`;
 if(n===0){r+=`<line x1="${x0+W*0.7}" y1="${y0}" x2="${x0+W*0.7}" y2="${y0+H}" stroke="#002C4A" stroke-width="1.2"/><line x1="${x0+W*0.7}" y1="${y0+H*0.5}" x2="${x0+W}" y2="${y0+H*0.5}" stroke="#002C4A" stroke-width="1.2"/>`+lab(x0+W*0.35,y0+H/2,'Комната-кухня',k)+lab(x0+W*0.85,y0+H*0.25,'Санузел',bath)+lab(x0+W*0.85,y0+H*0.75,'Прихожая',Math.round((A-k-bath)*10)/10);}
 else{const cw=W/(n+1);for(let i=1;i<=n;i++)r+=`<line x1="${x0+cw*i}" y1="${y0}" x2="${x0+cw*i}" y2="${y0+H*0.62}" stroke="#002C4A" stroke-width="1.2"/>`;
  r+=`<line x1="${x0}" y1="${y0+H*0.62}" x2="${x0+W}" y2="${y0+H*0.62}" stroke="#002C4A" stroke-width="1.2"/><line x1="${x0+W*0.6}" y1="${y0+H*0.62}" x2="${x0+W*0.6}" y2="${y0+H}" stroke="#002C4A" stroke-width="1.2"/>`;
  r+=lab(x0+cw/2,y0+H*0.3,'Кухня',k);for(let i=1;i<=n;i++)r+=lab(x0+cw*i+cw/2,y0+H*0.3,'Комната',roomA);
  r+=lab(x0+W*0.3,y0+H*0.8,'Прихожая',hall)+lab(x0+W*0.8,y0+H*0.8,'Санузел',bath);}
 r+=`<rect x="${x0+W*0.15}" y="${y0-1.5}" width="${W*0.2}" height="3" fill="#9FC6E8"/><rect x="${x0+W*0.6}" y="${y0-1.5}" width="${W*0.2}" height="3" fill="#9FC6E8"/>`;
 return `<svg viewBox="0 0 160 100" aria-hidden="true"><rect width="160" height="100" fill="#F3F5F7"/>${r}</svg>`;
}

function render(){
 app.dataset.anim=S.anim||'';S.anim='';
 if(APP_DIR!=='both'){S.dir=APP_DIR;S.picked=true;S.doors=false}
 if(!S.logged && !(S.stack.at(-1)?.screen==='track')){app.innerHTML=login();bindLogin();return}
 if(!S.picked || S.doors){app.dataset.area=S.dir;app.innerHTML=doors();return}
 const top=S.stack.at(-1);
 let h;
 if(top){
  const f={order,chat,newreq,realty,re:reForm,track,notes,obj:objFull,book:bookShow,myshows:myShows,zklist:zkList,zk:zkView,rentlist:rentList,valuation,tax:taxPage,compare,guide,pay:payScreen}[top.screen];
  h=f?f(top.arg):home();
 } else h=(S.dir==='re'?{home:reHome,objects,deal,mort:mortTab,profile}:{home,orders,calc,docs,profile})[S.tab]();
 app.dataset.area=S.dir;
 app.innerHTML=h;
 if(S.tab==='calc'&&!top) bindCalc();
 if(byId('v-out')){['v-city','v-m2','v-rooms','v-cond','v-house'].forEach(id=>{byId(id).addEventListener('input',valOut);byId(id).addEventListener('change',valOut)});valOut()}
 if(byId('tx-out')){['t-p','t-i','t-s'].forEach(id=>byId(id).addEventListener('input',taxOut));taxOut()}
 const od=byId('od-down'); if(od) od.addEventListener('input',()=>{const P=+od.dataset.price,p=+od.value,dv=Math.round(P*p/100);byId('od-dv').textContent=p+'% · '+rub(dv);byId('od-pay').textContent=rub(mPay(P-dv,6,20))});
 if(byId('m-out')){['m-p','m-d','m-r','m-y'].forEach(id=>document.getElementById(id).addEventListener('input',mortgage));mortgage()}
 const cf=document.getElementById('chatf');
 if(cf) cf.addEventListener('submit',e=>{e.preventDefault();const inp=document.getElementById('chat-in');const t=inp.value.trim();if(!t)return;const id=top.arg;
  S.chat[id].push({me:1,t,h:'сейчас'});render();setTimeout(()=>{if(S.stack.at(-1)?.screen!=='chat')return;S.chat[id].push({me:0,t:'Приняла, посмотрю и отвечу. Это автоответ прототипа.',h:'сейчас'});render();window.scrollTo(0,document.body.scrollHeight)},1200);window.scrollTo(0,document.body.scrollHeight)});
}

  Clines[i][k]=k==='name'?e.target.value:+e.target.value.replace(/\s/g,'').replace(',','.')||0;
  byId('c-out').innerHTML=calcOut(ccompute(Cc.carrier));
  document.querySelectorAll('[data-act="ccar"]').forEach((b,bi)=>{const t=b.querySelectorAll('b')[1];if(t){const x=ccompute(bi);t.textContent=rub(x.total);}});
 }));
 ['c-china','c-cert','c-svh','c-ru'].forEach(id=>{const el=byId(id);if(el)el.addEventListener('input',()=>{Cc[id.slice(2)]=+el.value.replace(/\s/g,'').replace(',','.')||0;byId('c-out').innerHTML=calcOut(ccompute(Cc.carrier));});});

 const bt=e.target.closest('[data-bktime]'); if(bt){if(bt.disabled)return;S._bk.time=bt.dataset.bktime;document.querySelectorAll('[data-bktime]').forEach(b=>b.setAttribute('aria-pressed',b===bt));return}
 const rt=e.target.closest('[data-rentf]'); if(rt){S.rentF=rt.dataset.rentf;render();return}
 const rf=e.target.closest('[data-roomf]'); if(rf){S.roomF=rf.dataset.roomf;render();return}

 const fl=e.target.closest('[data-filter]'); if(fl){S.filter=fl.dataset.filter;render();return}

 const a=e.target.closest('[data-act]'); if(!a) return;
 const id=a.dataset.id;
 switch(a.dataset.act){
  case 'back':back();break;
  case 'worlds':S.doors=true;S.anim='doors';render();window.scrollTo(0,0);break;
  case 'worldsclose':S.doors=false;S.anim='tab';render();break;

  case 'chat':go('chat',id);break;
  case 'notes':go('notes');break;
  case 'newreq':go('newreq');break;
  case 'realty':go('realty');break;
  case 're':go('re',a.dataset.k);break;
  case 'track':go('track');break;
  case 'doc':docSheet(+a.dataset.i);break;
  case 'obj':go('obj',id);break;
  case 'fav':{const i=S.favs.indexOf(id);i<0?S.favs.push(id):S.favs.splice(i,1);save();render();toast(i<0?'Добавлено в избранное':'Убрано из избранного');break}
  case 'show':case 'book':go('book',id);break;
  case 'bkok':{if(!S._bk.time){toast('Пожалуйста, выберите удобное время показа');break}const o=S.objects.find(x=>x.id===id);S.shows=S.shows.filter(x=>x.obj!==id);S.shows.unshift({obj:id,zk:o.zk,flat:roomsTxt(o)+', '+m2(o)+' м²',day:S._bk.day,time:S._bk.time});
   S.notes.unshift({t:'Показ назначен: '+o.zk,d:S._bk.day+', '+S._bk.time+'. Олег встретит вас у офиса продаж.',h:'сейчас',re:true,new:true});save();back();toast('Показ назначен: '+S._bk.day+', '+S._bk.time);break}
  case 'myshows':go('myshows');break;case 'zklist':go('zklist');break;case 'zk':go('zk',id);break;case 'rentlist':go('rentlist');break;
  case 'valuation':go('valuation');break;case 'tax':go('tax');break;case 'compare':go('compare');break;case 'guide':go('guide');break;
  case 'fromcalc':{const r=ccompute(Cc.carrier);go('newreq',{what:Clines.map(x=>x.name).join(', ').slice(0,80),from:Cc.from,to:Cc.to,kg:Math.round(r.kg),m3:String(r.m3.toFixed(1)).replace('.',','),mode:r.c.mode,total:r.total});break}
  case 'ccar':Cc.carrier=+a.dataset.i;render();break;
  case 'cladd':Clines.push({name:'Новая позиция',qty:100,price:10,kg:50,m3:0.3,duty:5});render();break;
  case 'cldel':Clines.splice(+a.dataset.i,1);render();break;
  case 'sendreq':sendReq(a.dataset.mode);break;
  case 'resend':S.stack=[];S.tab='home';S.dir='re';save();render();toast('Заявка отправлена, менеджер по недвижимости свяжется с вами');break;
  case 'got':{const o=S.orders.find(x=>x.id===id);o.stage=8;o.dates[7]='сегодня';render();toast('Спасибо! Отметили получение');break}
  case 'issue':{const o=S.orders.find(x=>x.id===id);o.issue=true;go('chat',id);S.chat[id].push({me:1,t:'Есть проблема с грузом: опишу и пришлю фото.',h:'сейчас'});render();break}
  case 'pay':go('pay',id);break;
  case 'payok':{const o=S.orders.find(x=>x.id===id);const debt=o.sum-o.paid;o.paid=o.sum;(o.pays=o.pays||[]).push({d:'сегодня',s:debt,m:'Оплата по счёту'});save();back();toast('Оплата отмечена — менеджер увидит и подтвердит');break}
  case 'pack':toast('Соберём архив счетов, УПД и актов за период (в рабочей версии)');break;
  case 'sverka':toast('Запрос на акт сверки отправлен менеджеру');break;
  case 'adddir':S.dirs=(S.dirs||['imp']).concat(id);save();toast(id==='re'?'Недвижимость подключена, агент свяжется с вами':'Импорт подключён, менеджер свяжется с вами');render();break;
  case 'soon':toast(id+' — в рабочей версии');break;
  case 'invite':toast('Приглашение по номеру появится в рабочей версии');break;
  case 'tglogin':S.logged=true;save();render();toast('Вход через Telegram (пример)');break;
  case 'logout':S.logged=false;S.stack=[];S.tab='home';save();render();break;
  case 'dotrack':{const q=byId('t-in').value.trim().toUpperCase();const o=S.orders.find(x=>x.id===q||x.track===q||x.track2===q);
   byId('t-out').innerHTML=o?`<section class="panel" style="display:grid;gap:8px"><div class="row between"><span class="mono">${o.id}</span><span class="pill go">${cur(o)}</span></div><div class="small muted">${o.from} → ${o.to} · ${o.stage>=9?'получен':'план у вас '+o.plan}</div><div class="bar"><i style="width:${Math.round(Math.min(o.stage,9)/9*100)}%"></i></div><div class="hint" style="text-align:left">Без входа видно только этап. Суммы и документы — в кабинете.</div></section>`
    :'<div class="panel empty">Такой заказ не нашли. Проверьте, пожалуйста, номер, например TRM-0142, TRM-0137 или TRM-0129</div>';break}
 }
});
document.addEventListener('change',e=>{const n=e.target.dataset?.n;if(n){S.notify[n]=e.target.checked;save();toast((e.target.checked?'Включено: ':'Выключено: ')+e.target.getAttribute('aria-label'))}});
render();
})();
</script>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})</script></body>
